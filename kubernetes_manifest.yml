apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APPLICATION_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APPLICATION_NAME}
    spec:
      containers:
        - name: ${APPLICATION_NAME}
          image: ${CONTAINER_IMAGE_TAGGED}
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: auto-cicd-env
          volumeMounts:
            - name: auto-cicd-config
              mountPath: /app/config.yml
              subPath: config.yml
            - name: auto-cicd-config
              mountPath: /app/templates/common/.gitlab-ci.yml
              subPath: .gitlab-ci.yml
            - name: auto-cicd-config
              mountPath: /app/templates/common/kubernetes_manifest.yml
              subPath: kubernetes_manifest.yml

      volumes:
        - name: auto-cicd-config
          configMap:
            name: auto-cicd

      imagePullSecrets:
        - name: ecr-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ${APPLICATION_NAME}
  ports:
    - port: 80
      nodePort: ${K8S_NODEPORT}
