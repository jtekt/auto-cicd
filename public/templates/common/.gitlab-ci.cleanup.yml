stages:
  - cleanup # Stage responsible for tearing down the application from Kubernetes

variables:
  APPLICATION_NAME: autocicd-{{USERNAME}}-{{APPLICATION_NAME}}
  K8S_ENV_SECRET_NAME: ${APPLICATION_NAME}

# Tear down the application from Kubernetes
cleanup-job:
  stage: cleanup
  rules:
    - if: '$CI_COMMIT_BRANCH == "{{ROOT_REF}}"'
      exists:
        - kubernetes_manifest.yml
  before_script:
    # Uses the correct Kubernetes context
    - kubectl config use-context ${K8S_CONTEXT}

    # Uses the correct Kubernetes namespace
    - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
  script:
    # Delete all Kubernetes resources described in the manifest
    - envsubst < kubernetes_manifest.yml | kubectl delete -f - --ignore-not-found=true

    # Delete the environment secret
    - kubectl delete secret $K8S_ENV_SECRET_NAME --ignore-not-found=true
