# Default server configuration for Vite
server {
  listen 80;  # Port for Nginx to listen on
  server_name vite;  # Server name

  root /usr/share/nginx/html;  # Path to the static files generated by Vite
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;  # Handle history mode routing (important for SPA)
  }

  # Optional: Configure caching for static assets (images, JavaScript, CSS)
  location ~* \.(?:css|js|json|ico|woff2?|ttf|svg|eot|otf|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Optional: Error page for 404
  error_page 404 /index.html;
  location = /index.html {
    root /usr/share/nginx/html;
    internal;
  }
}
