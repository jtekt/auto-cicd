# Default server configuration for Vite

user  nginx;
worker_processes  1;

# Error log settings
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Main events context
events {
  worker_connections  1024;
}

# HTTP context
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

    # Basic server block to serve static files
  server {
    listen 80;  # Port for Nginx to listen on
    server_name localhost;  # Server name (use your domain name or IP address)

    root /usr/share/nginx/html;  # Path to the static files
    index index.html;  # Default file to serve

    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;  # Handle requests and serve index.html if not found
    }

    # Error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
