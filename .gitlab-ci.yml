stages:
  - build
  - deploy

variables:
  APPLICATION_NAME: auto-cicd
  CONTAINER_IMAGE_NAME: auto-cicd
  CONTAINER_IMAGE: ${AWS_ECR_URL}/${CONTAINER_IMAGE_NAME}
  CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:${CI_COMMIT_TAG}
  CONTAINER_IMAGE_LATEST: ${CONTAINER_IMAGE}:latest
  K8S_NAMESPACE: self-service-suite

# Build the Docker container image
build-job:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    # Create repository if needed
    - >
      aws ecr create-repository --repository-name ${CONTAINER_IMAGE_NAME}
      || echo "Repository might have already existed"
  script:
    # Build the container image
    - docker build --build-arg APP_VERSION=${CI_COMMIT_TAG} -t ${CONTAINER_IMAGE_TAGGED} -t ${CONTAINER_IMAGE_LATEST} .
    # Push container images to registry
    - docker push ${CONTAINER_IMAGE_TAGGED}
    - docker push ${CONTAINER_IMAGE_LATEST}

# Deploy to Kubernetes
deploy-job:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - kubectl config use-context eks-internal-public/gitlab-agent-for-kubernetes:eks-internal-public
    - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
    # Apply the Config
    - kubectl apply -f config_configmap.yml
    # Apply the Deployment
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -
    # Wait for rollout to complete
    - kubectl rollout status deployment/${APPLICATION_NAME} --timeout=5m