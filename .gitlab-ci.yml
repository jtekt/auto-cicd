stages:
  - build
  - deploy
  - release

variables:
  APPLICATION_NAME: auto-cicd
  CONTAINER_IMAGE_NAME: auto-cicd
  CONTAINER_IMAGE: ${AWS_ECR_URL}/${CONTAINER_IMAGE_NAME}
  CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:${CI_COMMIT_SHORT_SHA}
  K8S_NAMESPACE: fabel
  K8S_NODEPORT: 30174
  K8S_ECR_SECRET_NAME: ecr-credentials

# Build the Docker container image
build-job:
  stage: build
  tags:
    # optional: Docker is the default runner
    - docker
  only:
    - master
    - main
  before_script:
    # Create repository if needed
    - >
      aws ecr create-repository --repository-name ${CONTAINER_IMAGE_NAME}
      || echo "Repository might have already existed"
  script:
    # Build the container image
    - docker build -t ${CONTAINER_IMAGE_TAGGED} .
    # Push container images to registry
    - docker push ${CONTAINER_IMAGE_TAGGED}

# Deploy to Kubernetes
deploy-job:
  stage: deploy
  tags:
    # optional: Docker is the default runner
    - docker
  only:
    - master
    - main
  before_script:
    # Create Kubernetes secret for accessing ECR
    - >
      kubectl create secret docker-registry ${K8S_ECR_SECRET_NAME}
      --docker-server=${AWS_ECR_URL}
      --docker-username=AWS
      --docker-password $(aws ecr get-login-password)
      --dry-run=client -o yaml
      | kubectl apply -f -
  script:
    # Apply the Deployment
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -

  environment:
    name: production
    kubernetes:
      namespace: ${K8S_NAMESPACE}

# Release tagged versions
release-job:
  stage: release
  tags:
    - docker
  only:
    - tags
  before_script:
    - >
      aws ecr create-repository --repository-name ${CONTAINER_IMAGE_NAME}
      || echo "Repository might have already existed"
  script:
    - echo "Releasing version ${CI_COMMIT_TAG}"
    # Build the image fresh from the tagged commit
    - docker build -t ${CONTAINER_IMAGE}:${CI_COMMIT_TAG} .
    # Also tag as latest
    - docker tag ${CONTAINER_IMAGE}:${CI_COMMIT_TAG} ${CONTAINER_IMAGE}:latest
    # Push both tags
    - docker push ${CONTAINER_IMAGE}:${CI_COMMIT_TAG}
    - docker push ${CONTAINER_IMAGE}:latest